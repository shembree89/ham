<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1826">
  <meta name="description" content="Learn amateur radio. Master the Technician license exam with bite-sized lessons, smart flashcards, and practice tests.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="HAM Lab">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>HAM Lab · Technician License Prep</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="HAM Lab home"><span class="brand-icon">◉</span><span>HAM<span class="brand-light">LAB</span></span></button>
      <div class="top-right"><span id="offline-pill" class="pill hidden">● Offline</span><span class="pool-tag">TECH · 2026–30</span></div>
    </header>
    <main id="app" aria-live="polite">
      <section class="loading"><span class="spinner"></span><h1>Getting your station ready</h1><p>Loading the Technician question pool…</p></section>
    </main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">
      <button data-go="home" class="active"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button data-go="modules"><span class="nav-icon">▦</span><span>Learn</span></button>
      <button data-go="cards"><span class="nav-icon">▤</span><span>Cards</span></button>
      <button data-go="exam"><span class="nav-icon">◎</span><span>Exam</span></button>
      <button data-go="settings"><span class="nav-icon">⚙</span><span>More</span></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
