name: Technician question coverage audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out course
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 409-question lesson coverage
        run: node scripts/audit-coverage.mjs
